name: Deploy to ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/clausewise:$IMAGE_TAG .
          docker push $ECR_REGISTRY/clausewise:$IMAGE_TAG
          docker tag $ECR_REGISTRY/clausewise:$IMAGE_TAG $ECR_REGISTRY/clausewise:latest
          docker push $ECR_REGISTRY/clausewise:latest

      - name: Update ECS service
        run: |
          aws ecs update-service --cluster clausewise --service clausewise-service --force-new-deployment